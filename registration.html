<!-- ===== REGISTRATION ===== -->

<section id="register">

<h2 class="title">Student Registration</h2>

<form
action="https://formsubmit.co/chandelacademygr.noida@gmail.com"
method="POST">


<input
type="hidden"
name="_captcha"
value="false">


<input
type="hidden"
name="_template"
value="table">


<input
type="hidden"
name="_subject"
value="New Student Registration - Chandel Academy">


<!-- REGISTRATION DATE -->

<label class="form-label">
Registration Date
</label>

<input
type="date"
name="Registration Date"
required>


<!-- STUDENT NAME -->

<input
type="text"
name="Student Name"
placeholder="Student Name"
required>


<!-- DATE OF BIRTH -->

<label class="form-label">
Date of Birth
</label>

<input
type="date"
name="Date of Birth"
required>


<!-- GENDER -->

<select
name="Gender"
required>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

<option value="Other">
Other
</option>

</select>


<!-- CLASS -->

<input
type="text"
name="Class"
placeholder="Class"
required>


<!-- BOARD -->

<select
name="Board"
required>

<option value="">
Select Board
</option>

<option value="CBSE">
CBSE
</option>

<option value="ICSE">
ICSE
</option>

<option value="UP Board">
UP Board
</option>

</select>


<!-- FATHER NAME -->

<input
type="text"
name="Father Name"
placeholder="Father's Name"
required>


<!-- FATHER OCCUPATION -->

<input
type="text"
name="Father Occupation"
placeholder="Father's Occupation"
required>


<!-- MOTHER NAME -->

<input
type="text"
name="Mother Name"
placeholder="Mother's Name"
required>


<!-- MOTHER OCCUPATION -->

<input
type="text"
name="Mother Occupation"
placeholder="Mother's Occupation"
required>


<!-- MOBILE NUMBER -->

<input
type="tel"
name="Mobile Number"
placeholder="Mobile Number"
pattern="[0-9]{10}"
maxlength="10"
required>


<!-- SCHOOL NAME -->

<input
type="text"
name="School Name"
placeholder="School Name"
required>


<!-- ADDRESS -->

<textarea
rows="4"
name="Student Address"
placeholder="Student Address"
required></textarea>


<!-- STRONG SUBJECT -->

<input
type="text"
name="Strong Subject"
placeholder="Strong Subject"
required>


<!-- WEAK SUBJECT -->

<input
type="text"
name="Weak Subject"
placeholder="Weak Subject"
required>


<!-- PAST RESULT -->

<textarea
rows="5"
name="Past Result"
placeholder="Past Result"></textarea>


<!-- MAIN REASON -->

<label class="form-label">

The Main Reason for Taking Academy:

</label>


<div class="reason-box">


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="Basic Concepts Improve">

Basic Concepts Improve

</label>


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="School Exam Preparation">

School Exam Preparation

</label>


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="Board Exam Preparation">

Board Exam Preparation

</label>


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="Marks Improve">

Marks Improve

</label>


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="Homework/Regular Study">

Homework/Regular Study

</label>


<label class="reason-option">

<input
type="checkbox"
name="Main Reason"
value="Competitive Preparation">

Competitive Preparation

</label>


</div>


<!-- SUBMIT -->

<button type="submit">

Submit Registration

</button>


</form>

</section>
