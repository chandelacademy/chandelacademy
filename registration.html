<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration | Chandel Academy</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#06111f,#0c2238);
color:white;
padding:30px 15px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:30px;
}

.logo{
width:80px;
height:80px;
object-fit:contain;
background:white;
padding:7px;
border-radius:50%;
box-shadow:0 0 30px #FFD700;
margin-bottom:15px;
}

.header h1{
color:#FFD700;
font-size:32px;
margin-bottom:8px;
}

.header p{
color:#ddd;
font-size:16px;
}

.form-box{
background:rgba(255,255,255,0.06);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
box-shadow:0 0 30px rgba(0,0,0,0.3);
}

.form-title{
text-align:center;
color:#FFD700;
font-size:28px;
margin-bottom:25px;
}

input,
textarea{
width:100%;
padding:15px;
margin-bottom:18px;
border:none;
outline:none;
border-radius:12px;
background:rgba(255,255,255,0.1);
color:white;
font-size:15px;
}

input::placeholder,
textarea::placeholder{
color:#bbb;
}

textarea{
resize:none;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:#FFD700;
color:black;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #FFD70080;
}

.note{
text-align:center;
color:#aaa;
font-size:13px;
margin-top:20px;
line-height:1.6;
}

@media(max-width:600px){

.form-box{
padding:25px 18px;
}

.header h1{
font-size:27px;
}

.form-title{
font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<img src="logo.jpeg" class="logo">

<h1>Chandel Academy</h1>

<p>Student Registration</p>

</div>

<div class="form-box">

<h2 class="form-title">Registration Form</h2>

<form
action="https://formsubmit.co/chandelacademygr.noida@gmail.com"
method="POST">

<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_template" value="table">

<input
type="hidden"
name="_subject"
value="New Student Registration - Chandel Academy">

<input
type="text"
name="Student Name"
placeholder="Student Name"
required>

<input
type="text"
name="Class"
placeholder="Class"
required>

<input
type="text"
name="Father Name"
placeholder="Father's Name"
required>

<input
type="text"
name="Mother Name"
placeholder="Mother's Name"
required>

<input
type="tel"
name="Phone Number"
placeholder="Phone Number"
required>

<input
type="text"
name="School Name"
placeholder="School Name"
required>

<textarea
rows="4"
name="Address"
placeholder="Full Address"
required></textarea>

<textarea
rows="4"
name="Past Result"
placeholder="Past Result (Optional)"></textarea>

<button type="submit">
Submit Registration
</button>

</form>

<p class="note">
Your registration details will be sent to Chandel Academy.
</p>

</div>

</div>

</body>

</html>
