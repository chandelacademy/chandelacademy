<!-- ===== STUDENT REGISTRATION ===== -->

<section id="register">

<h2 class="title">Student Registration</h2>

<form 
action="https://formsubmit.co/chandelacademygr.noida@gmail.com" 
method="POST">

<!-- FormSubmit Settings -->

<input type="hidden" name="_captcha" value="false">

<input type="hidden" name="_template" value="table">

<input 
type="hidden" 
name="_subject" 
value="New Student Registration - Chandel Academy">

<!-- ===== STUDENT DETAILS ===== -->

<input 
type="text" 
name="Student Name" 
placeholder="Student Name" 
required>

<input 
type="date" 
name="Registration Date" 
required>

<input 
type="date" 
name="Date of Birth" 
required>

<select 
name="Gender" 
required
style="width:100%; padding:15px; margin:15px 0; border:none; outline:none; border-radius:12px; background:#ffffff10; color:white; font-size:16px;">

<option value="" style="color:black;">Select Gender</option>
<option value="Male" style="color:black;">Male</option>
<option value="Female" style="color:black;">Female</option>
<option value="Other" style="color:black;">Other</option>

</select>

<input 
type="text" 
name="Class" 
placeholder="Class" 
required>

<select 
name="Board" 
required
style="width:100%; padding:15px; margin:15px 0; border:none; outline:none; border-radius:12px; background:#ffffff10; color:white; font-size:16px;">

<option value="" style="color:black;">Select Board</option>
<option value="CBSE" style="color:black;">CBSE</option>
<option value="ICSE" style="color:black;">ICSE</option>
<option value="UP Board" style="color:black;">UP Board</option>

</select>

<!-- ===== PARENTS DETAILS ===== -->

<input 
type="text" 
name="Father Name" 
placeholder="Father's Name" 
required>

<input 
type="text" 
name="Father Occupation" 
placeholder="Father's Occupation">

<input 
type="text" 
name="Mother Name" 
placeholder="Mother's Name" 
required>

<input 
type="text" 
name="Mother Occupation" 
placeholder="Mother's Occupation">

<!-- ===== CONTACT DETAILS ===== -->

<input 
type="tel" 
name="Mobile Number" 
placeholder="Mobile Number" 
pattern="[0-9]{10}"
maxlength="10"
required>

<input 
type="text" 
name="School Name" 
placeholder="School Name" 
required>

<textarea 
rows="4" 
name="Address" 
placeholder="Full Address"
required></textarea>

<!-- ===== ACADEMIC DETAILS ===== -->

<input 
type="text" 
name="Strong Subject" 
placeholder="Strong Subject">

<input 
type="text" 
name="Weak Subject" 
placeholder="Weak Subject">

<textarea 
rows="5" 
name="Past Result" 
placeholder="Past Result / Previous Marks"></textarea>

<!-- ===== MAIN REASON ===== -->

<div style="
margin:20px 0;
padding:20px;
background:rgba(255,255,255,0.05);
border-radius:15px;
border:1px solid rgba(255,255,255,0.1);
">

<h3 style="
color:#FFD700;
margin-bottom:15px;
">

The main reason for taking Academy:

</h3>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="Basic Concepts Improve">

Basic Concepts Improve

</label>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="School Exam Preparation">

School Exam Preparation

</label>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="Board Exam Preparation">

Board Exam Preparation

</label>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="Marks Improve">

Marks Improve

</label>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="Homework/Regular Study">

Homework / Regular Study

</label>

<label style="display:block; margin:12px 0;">

<input 
type="checkbox" 
name="Reason" 
value="Competitive Preparation">

Competitive Preparation

</label>

</div>

<!-- ===== SUBMIT ===== -->

<button type="submit">

Submit Registration

</button>

</form>

</section>
